# =========================================================
# TAREA 4: compose.yaml generado por `docker init`
# =========================================================
# Docker Compose sirve para arrancar la app con UN solo comando,
# sin tener que acordarse de todos los flags de docker run.
#
#   docker compose up --build
#   docker compose down
#
# Es el equivalente a escribir a mano:
#   docker build -t 04-docker-init . && docker run -p 3000:3000 ...
#
# Su verdadera utilidad aparece cuando la app necesita varios
# servicios (una base de datos, un Redis...): los declaras todos
# aquí y Compose los levanta juntos y conectados entre sí.
# =========================================================

services:
  # "server" es el nombre del servicio. También es el nombre de red
  # con el que otros contenedores podrían llamarle (http://server:3000).
  server:
    # build: . -> construye la imagen con el Dockerfile de esta carpeta
    build:
      context: .

    environment:
      NODE_ENV: production

    # ports: "fuera:dentro"
    # 3000:3000 -> el puerto 3000 de tu ordenador va al 3000 del
    # contenedor. Si tuvieras el 3000 ocupado, pondrías "3001:3000".
    ports:
      - 3000:3000

